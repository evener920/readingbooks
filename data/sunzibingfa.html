<script>
/* ---- 主题切换（与首页一致） ---- */
(function () {
  var K = "rl-theme", btn = document.getElementById("themeBtn");
  if (!btn) return;
  function paint(t) {
    document.documentElement.setAttribute("data-theme", t);
    btn.innerHTML = t === "dark"
      ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l1.4 1.4M6.3 17.7l1.4 1.4"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
    try { localStorage.setItem(K, t); } catch (e) {}
  }
  function cur() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  paint(cur());
  btn.onclick = function () { paint(cur() === "dark" ? "light" : "dark"); };
})();

/* ---- 从 CSV 自动填充封面 / 信息 / 导航 ---- */
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseCSV(text) {
    text = String(text).replace(/\r\n?/g, "\n");
    var rows = [], row = [], field = "", i = 0, n = text.length, inQ = false;
    while (i < n) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; }
        field += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ',') { row.push(field); field = ""; i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }
  function csvToBooks(text) {
    var rows = parseCSV(text).filter(function (r) { return r.length && !(r.length === 1 && r[0].trim() === ""); });
    if (!rows.length) return [];
    var header = rows[0].map(function (h) { return h.trim(); }), out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i]; if (r.length === 1 && r[0].trim() === "") continue;
      var o = {}, j;
      for (j = 0; j < header.length; j++) o[header[j]] = (r[j] !== undefined) ? r[j] : "";
      o.id = (o.id || "").trim(); o.title = (o.title || "").trim();
      if (!o.title) continue;
      var sp = function (s) { return s ? s.split(";").map(function (x) { return x.trim(); }).filter(Boolean) : []; };
      o.tags = sp(o.tags); o.quotes = sp(o.quotes);
      o.progress = o.progress ? (parseInt(o.progress, 10) || 0) : 0;
      o.rating = o.rating ? (parseInt(o.rating, 10) || 0) : 0;
      o.year = o.year ? parseInt(o.year, 10) : "";
      out.push(o);
    }
    return out;
  }
  function hash(s) { var h = 0, str = String(s || ""); for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }
  var PALETTE = [["#3d6b58","#1f3a30"],["#8a5a3b","#4a2f1c"],["#3f5b7d","#22354d"],["#7a4b5e","#43273a"],["#6a6a3f","#3b3b22"],["#4a4a6b","#262640"],["#8c5a4a","#4c2b20"],["#2f6b6b","#173a3a"],["#6b5a8c","#382e52"],["#7d6a3f","#463a1f"]];
  function gradient(b) { var p = PALETTE[hash(b.id || b.title) % PALETTE.length]; return "linear-gradient(150deg," + p[0] + " 0%," + p[1] + " 100%)"; }
  function fixPath(p) {
    p = String(p || "").trim();
    if (!p || p.indexOf("http://") === 0 || p.indexOf("https://") === 0 || p.indexOf("//") === 0 || p.indexOf("../") === 0 || p.indexOf("#") === 0) return p;
    return "../" + p.replace(/^\//, "");
  }
  function coverHTML(b) {
    var ph = '<div class="ph" style="background:' + gradient(b) + '"><div class="ph-title">' + esc(b.title) + '</div><div class="ph-author">' + esc(b.author || "") + '</div></div>';
    if (b.cover) return ph + '<img src="' + esc(fixPath(b.cover)) + '" alt="' + esc(b.title) + '" onerror="this.style.display=\'none\'">';
    return ph;
  }

  var id = decodeURIComponent(location.pathname.split("/").pop().replace(/\.html$/, "")).trim();
  var $ = function (s) { return document.getElementById(s); };
  $("bp-date").textContent = new Date().toISOString().slice(0, 10);

  if (typeof fetch !== "function") {
    $("bp-title").textContent = "（本地直接打开无法读取导航，请用「预览.command」或部署后查看）";
    return;
  }
  fetch("../data/books.csv", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (t) {
      var books = csvToBooks(t);
      var ordered = books.slice().sort(function (a, b) {
        return (b.finishedAt || b.startedAt || "").localeCompare(a.finishedAt || a.startedAt || "");
      });
      var idx = -1;
      for (var i = 0; i < ordered.length; i++) { if ((ordered[i].id || "") === id) { idx = i; break; } }
      var b = idx >= 0 ? ordered[idx] : null;
      if (!b) { $("bp-title").textContent = '在 books.csv 里找不到 id 为「' + id + '」的书'; return; }

      document.title = b.title + " · 我的读书库";
      $("bp-cover").innerHTML = coverHTML(b);
      $("bp-title").textContent = b.title;
      var sub = [b.author || ""];
      if (b.translator) sub.push(b.translator + " 译");
      var pub = [b.publisher, b.year].filter(Boolean).join(" · ");
      if (pub) sub.push(pub);
      var stars = b.rating ? ("　" + "★".repeat(b.rating)) : "";
      $("bp-sub").textContent = sub.filter(Boolean).join("　") + stars;
      var tags = '<span class="tag">' + (b.status === "done" ? "已读" : b.status === "reading" ? "在读" : "想读") + "</span>";
      (b.tags || []).forEach(function (x) { tags += '<span class="tag">' + esc(x) + "</span>"; });
      $("bp-tags").innerHTML = tags;
      if (b.status === "reading") {
        var p = Math.max(0, Math.min(100, Number(b.progress) || 0));
        $("bp-progress").innerHTML = '<div class="bp-progress"><div class="bar"><i style="width:' + p + '%"></i></div><div class="bar-txt">读到 ' + p + "%</div></div>";
      }
      if (b.summary) { $("bp-summary-sec").hidden = false; $("bp-summary").textContent = b.summary; }
      var kv = [["作者", b.author], ["译者", b.translator], ["出版", pub], ["分类", b.category], ["起读", b.startedAt], ["读完", b.finishedAt]].filter(function (r) { return r[1]; });
      if (kv.length) {
        var h = ""; kv.forEach(function (r) { h += "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; });
        $("bp-kv-sec").hidden = false; $("bp-kv").innerHTML = h;
      }
      if (b.quotes && b.quotes.length) {
        var q = ""; b.quotes.forEach(function (x) { q += '<div class="quote">' + esc(x) + "</div>"; });
        $("bp-quotes-sec").hidden = false; $("bp-quotes").innerHTML = q;
      }
      var prev = idx > 0 ? ordered[idx - 1] : null, next = idx < ordered.length - 1 ? ordered[idx + 1] : null;
      function item(x, label, cls) {
        if (!x) return '<span class="bp-nav-item ' + cls + ' disabled"><span class="bp-nav-lbl">' + label + '</span><span class="bp-nav-ttl">没有了</span></span>';
        return '<a class="bp-nav-item ' + cls + '" href="' + esc(x.id) + '.html"><span class="bp-nav-lbl">' + label + '</span><span class="bp-nav-ttl">' + esc(x.title) + "</span></a>";
      }
      var back = '<a class="bp-nav-item prev" href="../index.html"><span class="bp-nav-lbl">返回</span><span class="bp-nav-ttl">整个书架</span></a>';
      $("bp-nav").innerHTML = item(prev, "上一本", "prev-nav") + back + item(next, "下一本", "next");
    })
    .catch(function () { $("bp-title").textContent = "（读不到 books.csv，请用「预览.command」或部署后查看）"; });
})();
</script>
</body>
