name = "readingbooks-hl-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

# KV 命名空间：先 `wrangler kv namespace create HL_KV` 拿到 id，填到下面
[[kv_namespaces]]
binding = "HL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 部署步骤（需 Cloudflare 令牌，权限含 Workers Scripts:Edit + Workers KV Storage:Edit）：
# 1) npm i -g wrangler
# 2) wrangler login   （或设置环境变量 CLOUDFLARE_API_TOKEN）
# 3) wrangler kv namespace create HL_KV   → 复制输出的 id 填到上面 id
# 4) wrangler deploy
# 部署成功后拿到 *.workers.dev 地址（或绑自定义域），填进书籍页脚本的 SYNC_ENDPOINT。
